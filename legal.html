  app language, in one self-contained file (no network requests).

  In the app it is loaded from assets/legal/legal.html; the app replaces the
  JSON in <script id="legal-config"> with its own values. Hosted on a
  website, the same file reads ?lang=xx and #privacy / #terms from the URL.
  Keep the "effective" date below current whenever the text changes.
-->

(function () {
  var ORDER = ["en", "es", "fr", "de", "pt", "ar", "hi", "zh", "ru"];
  var DOCS = ["privacy", "terms"];
  var cfg = {};
  try { cfg = JSON.parse(document.getElementById("legal-config").textContent || "{}") || {}; } catch (e) { cfg = {}; }
  var params = new URLSearchParams(location.search);
  var state = {
    lang: pickLang(cfg.lang || params.get("lang") || ""),
    doc: DOCS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : (DOCS.indexOf(cfg.doc) >= 0 ? cfg.doc : "privacy"),
    theme: cfg.theme === "dark" || cfg.theme === "light" ? cfg.theme : ""
  };
  var vars = {
    app: String(cfg.appName || "Tapelet"),
    developer: String(cfg.developer || cfg.appName || "Tapelet"),
    email: String(cfg.email || "")
  };

  function pickLang(wanted) {
    var candidates = [wanted].concat(navigator.languages || [navigator.language || ""]);
    for (var i = 0; i < candidates.length; i++) {
      var code = String(candidates[i] || "").toLowerCase().split(/[-_]/)[0];
      if (I18N[code]) return code;
    }
    return "en";
  }

  // Fills {app}, {developer} and {email} as text nodes; {email} becomes a
  // mailto link, or the "contact us" fallback when no address is configured.
  function fill(el, template, t) {
    var parts = String(template).split(/(\{app\}|\{developer\}|\{email\}|\{date\})/);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p === "{app}") el.appendChild(document.createTextNode(vars.app));
      else if (p === "{developer}") el.appendChild(document.createTextNode(vars.developer));
      else if (p === "{date}") el.appendChild(document.createTextNode(formatDate()));
      else if (p === "{email}") {
        if (vars.email) {
          var a = document.createElement("a");
          a.href = "mailto:" + encodeURI(vars.email);
          a.textContent = vars.email;
          a.dir = "ltr";
          el.appendChild(a);
        } else {
          el.appendChild(document.createTextNode(t.ui.noEmail));
        }
      } else if (p) appendText(el, p);
    }
    return el;
  }

  // Plain text with https:// addresses turned into links.
  function appendText(el, text) {
    var re = /https:\/\/[^\s<>"]*[^\s<>".,;:!?)\u3002\uff0c]/g;
    var last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement("a");
      a.href = m[0];
      a.textContent = m[0];
      a.rel = "noopener noreferrer";
      a.target = "_blank";
      a.dir = "ltr";
      el.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
  }

  function formatDate() {
    var d = new Date(EFFECTIVE_DATE + "T12:00:00Z");
    try {
      return new Intl.DateTimeFormat(state.lang, { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" }).format(d);
    } catch (e) {
      return EFFECTIVE_DATE;
    }
  }

  function node(tag, cls) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    return el;
  }

  function renderDoc(name, t) {
    var doc = t[name];
    var root = document.getElementById("doc-" + name);
    root.textContent = "";
    var h1 = fill(node("h1", "doc-title"), doc.title, t);
    root.appendChild(h1);
    root.appendChild(fill(node("p", "effective"), t.ui.effective, t));
    var summary = node("div", "summary");
    for (var s = 0; s < doc.summary.length; s++) summary.appendChild(fill(node("p"), doc.summary[s], t));
    root.appendChild(summary);

    var toc = node("nav", "toc");
    toc.setAttribute("aria-label", t.ui.contents);
    var ol = node("ol");
    toc.appendChild(ol);
    root.appendChild(toc);

    for (var i = 0; i < doc.sections.length; i++) {
      var sec = doc.sections[i];
      var id = name + "-" + (i + 1);
      var h2 = fill(node("h2"), (i + 1) + ". " + sec[0], t);
      h2.id = id;
      root.appendChild(h2);
      var li = node("li");
      var link = fill(node("a"), sec[0], t);
      link.href = "#" + id;
      link.addEventListener("click", jumpTo(id));
      li.appendChild(link);
      ol.appendChild(li);
      for (var j = 1; j < sec.length; j++) {
        var block = sec[j];
        if (Array.isArray(block)) {
          var ul = node("ul");
          for (var k = 0; k < block.length; k++) ul.appendChild(fill(node("li"), block[k], t));
          root.appendChild(ul);
        } else {
          root.appendChild(fill(node("p"), block, t));
        }
      }
    }
  }

  // In-page links scroll without changing the URL, so the app's web view
  // never sees a navigation.
  function jumpTo(id) {
    return function (event) {
      event.preventDefault();
      var target = document.getElementById(id);
      if (!target) return;
      target.scrollIntoView({ block: "start" });
      target.setAttribute("tabindex", "-1");
      target.focus({ preventScroll: true });
    };
  }

  function render() {
    var t = I18N[state.lang];
    var html = document.documentElement;
    html.lang = state.lang;
    html.dir = t.dir;
    if (state.theme) html.setAttribute("data-theme", state.theme); else html.removeAttribute("data-theme");
    document.body.classList.toggle("embedded", !!cfg.embedded);
    document.title = (state.doc === "terms" ? t.terms.title : t.privacy.title).replace("{app}", vars.app);
    document.getElementById("brand").textContent = vars.app;
    document.getElementById("lang-label").textContent = t.ui.language;
    var tp = document.getElementById("tab-privacy");
    var tt = document.getElementById("tab-terms");
    tp.textContent = t.ui.privacy;
    tt.textContent = t.ui.terms;
    document.getElementById("tabs").setAttribute("aria-label", t.ui.documents);
    renderDoc("privacy", t);
    renderDoc("terms", t);
    var footer = document.getElementById("footer");
    footer.textContent = "";
    footer.appendChild(fill(node("p"), t.ui.footer, t));
    var select = document.getElementById("lang-select");
    if (!select.options.length) {
      for (var i = 0; i < ORDER.length; i++) {
        if (!I18N[ORDER[i]]) continue;
        var o = document.createElement("option");
        o.value = ORDER[i];
        o.textContent = I18N[ORDER[i]].name;
        o.lang = ORDER[i];
        select.appendChild(o);
      }
      select.addEventListener("change", function () {
        state.lang = pickLang(select.value);
        render();
        if (!cfg.embedded && history.replaceState) {
          var url = new URL(location.href);
          url.searchParams.set("lang", state.lang);
          history.replaceState(null, "", url);
        }
      });
    }
    select.value = state.lang;
    show(state.doc, false);
  }

  function show(doc, focus) {
    state.doc = doc;
    for (var i = 0; i < DOCS.length; i++) {
      var on = DOCS[i] === doc;
      var tab = document.getElementById("tab-" + DOCS[i]);
      tab.setAttribute("aria-selected", on ? "true" : "false");
      tab.tabIndex = on ? 0 : -1;
      document.getElementById("doc-" + DOCS[i]).hidden = !on;
    }
    var t = I18N[state.lang];
    document.title = (doc === "terms" ? t.terms.title : t.privacy.title).replace("{app}", vars.app);
    if (focus) document.getElementById("tab-" + doc).focus();
  }

  var tabs = document.getElementById("tabs");
  tabs.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-doc]");
    if (!b) return;
    show(b.getAttribute("data-doc"), false);
    if (!cfg.embedded && history.replaceState) history.replaceState(null, "", "#" + state.doc);
    window.scrollTo(0, 0);
  });
  tabs.addEventListener("keydown", function (e) {
    var keys = { ArrowRight: 1, ArrowLeft: -1, Home: 0, End: 0 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    var i = DOCS.indexOf(state.doc);
    var rtl = document.documentElement.dir === "rtl";
    var step = keys[e.key] * (rtl ? -1 : 1);
    var next = e.key === "Home" ? 0 : e.key === "End" ? DOCS.length - 1 : (i + step + DOCS.length) % DOCS.length;
    show(DOCS[next], true);
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (DOCS.indexOf(h) >= 0) show(h, false);
  });

  // Called by the app when its language or theme changes while open.
  window.Legal = {
    configure: function (lang, theme) {
      state.lang = pickLang(lang);
      state.theme = theme === "dark" || theme === "light" ? theme : "";
      render();
    }
  };

  render();
})();
</script>
